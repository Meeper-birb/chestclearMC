plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[4.1.0,4.2)'
}

version = '1.0.0'
group = 'com.clearrenderchests'
archivesBaseName = 'ClearRenderChests'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client { workingDirectory project.file('run'); mods { clearrenderchests { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { clearrenderchests { source sourceSets.main } } }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

jar {
    manifest {
        attributes(["Specification-Title": "clearrenderchests", "Implementation-Version": project.version])
    }
}

jar.finalizedBy('reobfJar')
